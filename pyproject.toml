[project]
name = "arithmp"
version = "0.1.0"
description = "Command-line interface for the Arithmp package"
readme = "README.md"
authors = [{ name = "Mikaël Capelle", email = "capelle.mikael@gmail.com" }]
requires-python = ">=3.13"
dependencies = ["click>=8.5.0", "lark>=1.3.1"]

[project.scripts]
arithmp = "arithmp.__main__:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"


[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "poethepoet>=0.49.0",
    "ruff>=0.17.1",
    "ty>=0.0.90",
]


[tool.poe.tasks]
_linter = "uv run ruff check"
_typechecker = "uv run ty check"
check_code = ["_linter", "_typechecker"]